<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>升本通 · 管理后台</title>
<style>
  body{font-family:"Microsoft YaHei",sans-serif;background:#F5F7FA;margin:0;padding:24px;color:#333}
  h1{color:#4A90D9;font-size:22px;margin:0 0 20px}
  h2{font-size:16px;margin:0 0 12px;color:#333}
  .card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:18px;margin-bottom:18px}
  input[type=text]{width:60%;padding:8px;border:1px solid #ccc;border-radius:6px}
  button{background:#4A90D9;color:#fff;border:none;border-radius:6px;padding:8px 18px;margin-left:8px;cursor:pointer;font-size:14px}
  button:hover{background:#3a7bc0}
  button:disabled{background:#ccc;cursor:not-allowed}
  table{border-collapse:collapse;width:100%}
  th,td{border:1px solid #e3e8ee;padding:6px 10px;text-align:left;font-size:14px}
  th{background:#eef4fb}
  pre{background:#f4f6f8;padding:12px;border-radius:6px;max-height:400px;overflow:auto;font-size:12px;white-space:pre-wrap}
  .ok{color:#52C41A}.warn{color:#fa8c16}.bad{color:#FF4D4F}
  .err-table{width:100%;border-collapse:collapse;margin-top:8px}
  .err-table th{background:#fff1f0;color:#cf1322;font-size:12px}
  .err-table td{font-size:13px;padding:4px 8px}
  .err-table .code{font-weight:bold;color:#cf1322;font-family:monospace}
  .section-title{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .badge{padding:2px 8px;border-radius:4px;font-size:12px;font-weight:bold}
  .badge-success{background:#f6ffed;color:#52C41A;border:1px solid #b7eb8f}
  .badge-partial{background:#fffbe6;color:#fa8c16;border:1px solid #ffe58f}
  .badge-failed{background:#fff2f0;color:#ff4d4f;border:1px solid #ffccc7}
  .summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
  .summary-item{text-align:center;padding:10px;border-radius:8px;background:#f8f9fa}
  .summary-item .num{font-size:28px;font-weight:bold;color:#4A90D9}
  .summary-item .label{font-size:12px;color:#666}
  details{margin-top:8px}
  summary{cursor:pointer;color:#4A90D9;font-size:14px}
  details[open] summary{margin-bottom:8px}
</style>
</head>
<body>
<h1>升本通 · 管理后台</h1>

<div class="card">
  <h2>📥 导入题库</h2>
  <input id="path" type="text" placeholder="输入服务器上的题库根目录路径，如 D:\dev\upmark\shengbentong\test-bank">
  <button id="btnImport" onclick="doImport()">导入</button>
  <span style="margin-left:12px;font-size:13px;color:#666">
    模板：<a href="/api/admin/template?kind=md" target="_blank">MD格式模板</a> ·
    <a href="/api/admin/template?kind=prompt" target="_blank">AI出题提示词</a> ·
    <a href="/api/admin/template?kind=full" target="_blank">完整出题模板(推荐)</a>
  </span>
</div>

<div class="card" id="reportCard" style="display:none">
  <div class="section-title">
    <h2>📊 导入报告</h2>
    <span id="statusBadge" class="badge"></span>
    <button onclick="copyReport()" style="margin-left:auto">📋 一键复制错误(回喂AI修复)</button>
  </div>

  <div class="summary-grid" id="summaryGrid"></div>

  <div id="errSection" style="display:none">
    <h2 class="bad">❌ 被跳过的题目（点击复制后发给AI修复）</h2>
    <table class="err-table">
      <thead><tr><th>文件</th><th>行号</th><th>错误码</th><th>原因</th><th>题干预览</th></tr></thead>
      <tbody id="errBody"></tbody>
    </table>
  </div>

  <div id="skipSection" style="display:none">
    <h2 class="warn">⏭️ 被跳过的分区（主观题/不支持题型）</h2>
    <table class="err-table">
      <thead><tr><th>分区头</th><th>起始行</th><th>结束行</th></tr></thead>
      <tbody id="skipBody"></tbody>
    </table>
  </div>

  <div id="warnSection" style="display:none">
    <h2 class="warn">⚠️ 警告（已自动修复，题目保留）</h2>
    <table class="err-table">
      <thead><tr><th>文件</th><th>行号</th><th>警告码</th><th>说明</th></tr></thead>
      <tbody id="warnBody"></tbody>
    </table>
  </div>

  <details>
    <summary>查看原始JSON</summary>
    <pre id="rawJson"></pre>
  </details>
</div>

<div class="card">
  <h2>📈 题库统计</h2>
  <table id="stats"><thead><tr><th>科目</th><th>章节</th><th>题目</th><th>按题型</th></tr></thead><tbody></tbody></table>
</div>

<script>
const typeNames = {single_choice:'单选', multiple_choice:'多选', judgment:'判断', fill_blank:'填空'};
let lastReport = null;

async function loadStats(){
  const r = await fetch('/api/admin/stats'); const d = await r.json();
  const tb = document.querySelector('#stats tbody'); tb.innerHTML='';
  for(const s of d.subjects){
    const types = Object.entries(s.by_type).map(([k,v])=>`${typeNames[k]||k}:${v}`).join(' ');
    tb.insertAdjacentHTML('beforeend',
      `<tr><td>${s.name}</td><td>${s.chapters}</td><td>${s.questions}</td><td>${types}</td></tr>`);
  }
}

async function doImport(){
  const path = document.getElementById('path').value.trim();
  if(!path){ alert('请输入路径'); return; }
  const btn = document.getElementById('btnImport');
  btn.disabled = true; btn.textContent = '导入中…';
  try {
    const r = await fetch('/api/admin/import',{method:'POST',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify({path})});
    const d = await r.json();
    if(r.status===404){ alert(d.detail); return; }
    if(r.status===400){ alert('导入失败:\n' + JSON.stringify(d.detail,null,2)); return; }
    lastReport = d;
    renderReport(d);
    loadStats();
  } catch(e) { alert('请求失败: '+e); }
  finally { btn.disabled=false; btn.textContent='导入'; }
}

function renderReport(d){
  const card = document.getElementById('reportCard');
  card.style.display = 'block';
  const rep = d.report || {};
  const badge = document.getElementById('statusBadge');
  badge.textContent = d.status.toUpperCase();
  badge.className = 'badge badge-' + d.status;

  // 摘要
  const sg = document.getElementById('summaryGrid');
  sg.innerHTML = `
    <div class="summary-item"><div class="num">${rep.questions ?? 0}</div><div class="label">入库题目</div></div>
    <div class="summary-item"><div class="num">${rep.files_total ?? 0}</div><div class="label">文件数</div></div>
    <div class="summary-item"><div class="num warn">${rep.questions_skipped ?? 0}</div><div class="label">跳过题目</div></div>
    <div class="summary-item"><div class="num warn">${rep.sections_skipped ?? 0}</div><div class="label">跳过分区</div></div>`;

  // 跳过题目
  const skipped = rep.skipped_questions ?? rep.skippedQuestions ?? [];
  const errSec = document.getElementById('errSection');
  const errBody = document.getElementById('errBody');
  errBody.innerHTML = '';
  if(skipped.length > 0){
    errSec.style.display = 'block';
    for(const s of skipped){
      errBody.insertAdjacentHTML('beforeend',
        `<tr><td>${s.file ?? '-'}</td><td>${s.line ?? '-'}</td><td class="code">${s.code}</td><td>${s.reason ?? ''}</td><td>${(s.stem_preview ?? '').substring(0,50)}</td></tr>`);
    }
  } else { errSec.style.display = 'none'; }

  // 跳过分区
  const sections = rep.skipped_sections ?? rep.skippedSections ?? [];
  const skipSec = document.getElementById('skipSection');
  const skipBody = document.getElementById('skipBody');
  skipBody.innerHTML = '';
  if(sections.length > 0){
    skipSec.style.display = 'block';
    for(const s of sections){
      skipBody.insertAdjacentHTML('beforeend',
        `<tr><td>${s.header ?? s.section ?? '-'}</td><td>${s.start_line ?? '-'}</td><td>${s.end_line ?? '-'}</td></tr>`);
    }
  } else { skipSec.style.display = 'none'; }

  // 警告
  const warnings = rep.warnings ?? [];
  const warnSec = document.getElementById('warnSection');
  const warnBody = document.getElementById('warnBody');
  warnBody.innerHTML = '';
  if(warnings.length > 0){
    warnSec.style.display = 'block';
    for(const w of warnings){
      warnBody.insertAdjacentHTML('beforeend',
        `<tr><td>${w.file ?? '-'}</td><td>${w.line ?? '-'}</td><td class="code">${w.code}</td><td>${w.msg ?? ''}</td></tr>`);
    }
  } else { warnSec.style.display = 'none'; }

  // 原始JSON
  document.getElementById('rawJson').textContent = JSON.stringify(rep, null, 2);
}

function copyReport(){
  if(!lastReport) return;
  const rep = lastReport.report ?? {};
  const skipped = rep.skipped_questions ?? rep.skippedQuestions ?? [];
  const sections = rep.skipped_sections ?? rep.skippedSections ?? [];
  let text = '你刚才输出的文档有部分题目未通过格式校验。\n请重新输出修正后的完整文档，仍然遵守全部铁律。\n\n';
  if(skipped.length > 0){
    text += '=== 被跳过的题目 ===\n';
    for(const s of skipped){
      text += `- 行${s.line}: [${s.code}] ${s.reason}\n  题干: ${s.stem_preview}\n`;
    }
  }
  if(sections.length > 0){
    text += '\n=== 被跳过的分区（不需要输出） ===\n';
    for(const s of sections){ text += `- ${s.header ?? s.section}\n`; }
  }
  text += '\n请修复以上问题后重新输出完整文档。';
  navigator.clipboard.writeText(text);
  alert('已复制到剪贴板，粘贴给AI即可修复');
}

loadStats();
</script>
</body>
</html>
