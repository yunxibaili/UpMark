name: shengbentong
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_highlight: ^0.7.0
  flutter_math_fork: ^0.7.4
  image_picker: ^1.1.2
  markdown: ^7.3.0
  markdown_widget: ^2.3.2+8
  path: ^1.9.1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2+1

hooks:
  user_defines:
    sqlite3:
      # T-125: 构建环境无法访问 github.com（sqlite3 钩子默认从 release 下载预编译库）。
      # Android 端实际走 sqflite 框架层，不消费此包；Windows 测试用系统 winsqlite3.dll。
      source: system
      name_windows: winsqlite3

flutter:
  uses-material-design: true
